name: daily-digest

on:
  schedule:
    - cron: "0 22 * * 0-4"  # UTC 22:00 = JST 翌7:00(月〜金 朝に相当)
  workflow_dispatch: {}      # 手動実行用(Actionsタブから "Run workflow" で実行可能)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Run daily batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/run-daily.js

      - name: Commit updated data
        run: |
          git config user.name "daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tiles.json
          git commit -m "chore: daily tiles update" || echo "no changes"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
